  connect-src 'self' ws: wss: https://pagead2.googlesyndication.com https://googleads.g.doubleclick.net;
  frame-src https://googleads.g.doubleclick.net https://*.google.com;
  object-src 'none';
  base-uri 'self';
" />

<body>

<noscript>
  <div style="max-width:480px;margin:80px auto;padding:28px;text-align:center;font-family:sans-serif;background:#ece2c6;color:#2a231b;border-radius:6px;">

<div class="grain"></div>

<!-- global settings trigger, visible on every screen -->
<div class="corner-controls">
  <button id="btn-settings" class="btn-icon" title="settings" aria-label="settings">⚙</button>
</div>

<!-- ======================= OVERLAY: SETTINGS ======================= -->
<div id="overlay-settings" class="overlay hidden">
  <div class="settings-card">
    <div class="settings-head">
      <span data-i18n="settings_title"></span>
      <button id="btn-settings-close" class="btn-icon small" aria-label="close">✕</button>
    </div>

    <div class="settings-block">
      <div class="settings-label" data-i18n="settings_language"></div>
      <div id="lang-menu" class="lang-menu">
        <button class="lang-option" data-lang="en"><span class="flag">🇬🇧</span> English</button>
        <button class="lang-option" data-lang="el"><span class="flag">🇬🇷</span> Ελληνικά</button>
        <button class="lang-option" data-lang="es"><span class="flag">🇪🇸</span> Español</button>
      </div>
    </div>

    <div class="settings-block">
      <div class="settings-row">
        <span data-i18n="settings_sfx"></span>
        <button id="toggle-sfx" class="toggle-switch" aria-pressed="true"><span class="knob"></span></button>
      </div>
      <input id="sfx-volume" type="range" min="0" max="1" step="0.05" class="volume-slider" />
    </div>

    <div class="settings-block">
      <div class="settings-row">
        <span data-i18n="settings_music"></span>
        <button id="toggle-music" class="toggle-switch" aria-pressed="false"><span class="knob"></span></button>
      </div>
      <input id="music-volume" type="range" min="0" max="1" step="0.05" class="volume-slider" />
    </div>

    <div class="settings-block">
      <div class="settings-row">
        <span data-i18n="settings_reduce_motion"></span>
        <button id="toggle-motion" class="toggle-switch" aria-pressed="false"><span class="knob"></span></button>
      </div>
    </div>

    <button id="btn-forget-me" class="btn-ghost full" data-i18n="settings_forget"></button>
  </div>
</div>


<!-- ============================ SCREEN: HOME ============================ -->
<section id="screen-home" class="screen active">
  <div class="home-wrap">
    <div class="case-tab">CASE FILE №<span id="rand-case">0417</span></div>
    <h1 class="logo">DERAIL</h1>
    <p class="tagline" data-i18n="tagline"></p>

    <div class="home-card">
      <div id="auth-section" class="auth-section hidden">
        <div id="auth-logged-out">
          <p class="auth-prompt" data-i18n="login_prompt"></p>
          <div id="auth-buttons" class="auth-buttons"></div>
          <div class="divider"><span data-i18n="play_as_guest"></span></div>
        </div>
        <div id="auth-logged-in" class="auth-logged-in hidden">
          <img id="auth-avatar" class="auth-avatar hidden" alt="" />
          <span data-i18n="logged_in_as"></span> <b id="auth-name-display"></b>
          <button id="btn-logout" class="btn-ghost small" data-i18n="logout"></button>
        </div>
      </div>

      <div class="field">
        <label for="name-input" data-i18n="name_label"></label>
        <div class="name-row">
          <input id="name-input" maxlength="18" data-i18n-placeholder="name_placeholder" autocomplete="off" />
          <button id="btn-customize" class="avatar-preview-btn" type="button" title="customize character">
            <span id="avatar-preview"></span>
          </button>
        </div>
      </div>

      <div class="home-actions">
        <button id="btn-create" class="btn btn-primary" data-i18n="create_btn"></button>
        <button id="btn-quick-match" class="btn btn-secondary" data-i18n="quick_match_btn"></button>
        <div class="divider"><span data-i18n="or"></span></div>
        <div class="join-row">
          <input id="code-input" maxlength="4" data-i18n-placeholder="code_placeholder" autocomplete="off" class="code-input" />
          <button id="btn-join" class="btn btn-secondary" data-i18n="join_btn"></button>
        </div>
      </div>
      <p id="join-banner" class="join-banner hidden"></p>
      <p id="home-error" class="error-line"></p>
    </div>

    <details class="rules">
      <summary data-i18n="rules_summary"></summary>
      <ol id="rules-list"></ol>
    </details>

    <div class="ad-slot">
      <span class="ad-slot-label">Advertisement</span>
      <!-- Create an ad unit in your AdSense dashboard and paste its slot ID
           into data-ad-slot below (see README, "Ads" section). -->
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-7313911947751437"
           data-ad-slot="0000000000"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </div>
  </div>
</section>

<!-- ======================= OVERLAY: AVATAR BUILDER ======================= -->
<div id="overlay-avatar" class="overlay hidden">
  <div class="callout-card avatar-card">
    <div class="callout-head" data-i18n="avatar_title"></div>
    <div class="avatar-builder">
      <div id="avatar-big-preview" class="avatar-big-preview"></div>

      <div class="avatar-picker-block">
        <div class="settings-label" data-i18n="avatar_color"></div>
        <div id="avatar-skin-swatches" class="swatch-row"></div>
      </div>
    </div>
    <button id="btn-avatar-done" class="btn btn-primary settings-done" data-i18n="settings_close"></button>
  </div>
</div>

<!-- ============================ SCREEN: LOBBY ============================ -->
<section id="screen-lobby" class="screen">
  <header class="topbar">
    <div class="topbar-code">
      <span data-i18n="file_label"></span>
      <span id="lobby-code">----</span>
      <button id="btn-toggle-code" class="btn-icon-inline" title="show/hide room code" aria-label="show/hide room code">👁</button>
    </div>
    <button id="btn-copy-link" class="btn-ghost" data-i18n="copy_invite"></button>
  </header>

  <div class="lobby-wrap">
    <h2 class="section-title" data-i18n="the_roster"></h2>
    <ul id="lobby-players" class="roster"></ul>

    <div id="match-settings-block" class="match-settings hidden">
      <h3 class="rail-title" data-i18n="match_settings_title"></h3>

      <div class="match-setting-row">
        <span data-i18n="settings_language"></span>
        <div id="match-lang-menu" class="lang-menu inline">
          <button class="lang-option" data-lang="en">🇬🇧 EN</button>
          <button class="lang-option" data-lang="el">🇬🇷 EL</button>
          <button class="lang-option" data-lang="es">🇪🇸 ES</button>
        </div>
      </div>

      <div class="match-setting-row match-scenario-row">
        <span data-i18n="match_custom_scenario"></span>
        <input id="match-custom-scenario" maxlength="200" data-i18n-placeholder="match_custom_scenario_placeholder" class="mini-input" />
      </div>

      <div class="match-setting-row">
        <span data-i18n="match_turn_time"></span>
        <select id="match-turn-seconds" class="mini-select">
          <option value="10">10s</option>
          <option value="15">15s</option>
          <option value="20">20s</option>
          <option value="30">30s</option>
        </select>
      </div>

      <div class="match-setting-row">
        <span data-i18n="match_rounds"></span>
        <select id="match-max-rounds" class="mini-select">
          <option value="6">6</option>
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="14">14</option>
          <option value="20">20</option>
        </select>
      </div>

      <div class="match-setting-row">
        <span data-i18n="match_trojan"></span>
        <select id="match-trojan-mode" class="mini-select">
          <option value="auto" data-i18n="match_trojan_auto"></option>
          <option value="always" data-i18n="match_trojan_always"></option>
          <option value="never" data-i18n="match_trojan_never"></option>
        </select>
      </div>

      <div class="match-setting-row">
        <span data-i18n="match_chaos"></span>
        <select id="match-chaos" class="mini-select">
          <option value="off" data-i18n="match_chaos_off"></option>
          <option value="normal" data-i18n="match_chaos_normal"></option>
          <option value="chaos" data-i18n="match_chaos_chaos"></option>
        </select>
      </div>

      <div class="match-setting-row">
        <span data-i18n="match_public"></span>
        <button id="toggle-public" class="toggle-switch" role="switch"><span class="knob"></span></button>
      </div>

      <div class="match-setting-row">
        <span data-i18n="match_ai_judge"></span>
        <button id="toggle-ai-judge" class="toggle-switch" role="switch"><span class="knob"></span></button>
      </div>
      <p id="ai-judge-hint" class="hint ai-judge-hint hidden" data-i18n="match_ai_judge_unavailable"></p>
    </div>
    <p id="match-settings-readonly" class="hint hidden"></p>

    <div id="host-controls" class="host-controls">
      <button id="btn-start" class="btn btn-primary btn-lg" data-i18n="start_game_btn"></button>
      <p class="hint" data-i18n="need_two"></p>
    </div>
    <p id="waiting-note" class="hint hidden" data-i18n="waiting_host"></p>

    <div class="ad-slot">
      <span class="ad-slot-label">Advertisement</span>
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-7313911947751437"
           data-ad-slot="0000000000"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </div>
  </div>
</section>

<!-- ============================ SCREEN: GAME ============================ -->
<section id="screen-game" class="screen">
  <header class="topbar">
    <div class="topbar-code"><span data-i18n="file_label"></span> <span id="game-code">----</span></div>
    <div class="topbar-round"><span data-i18n="round_label"></span> <span id="round-num">0</span> / <span id="round-max">10</span></div>
    <button id="btn-leave" class="btn-ghost" data-i18n="leave_btn"></button>
  </header>

  <div class="game-wrap">

    <!-- Left: players / suspects rail -->
    <aside class="rail">
      <h3 class="rail-title" data-i18n="suspects"></h3>
      <ul id="player-rail" class="rail-list"></ul>

      <div class="goal-card" id="goal-card">
        <div class="goal-pin"></div>
        <div class="goal-label" data-i18n="your_objective"></div>
        <div class="goal-text" id="goal-text"></div>
      </div>
    </aside>

    <!-- Center: the story -->
    <main class="storyboard">
      <div class="scenario-strip" id="scenario-strip"></div>

      <div class="banned-strip" id="banned-strip"></div>

      <div class="paper">
        <div class="paper-torn"></div>
        <div class="story-feed" id="story-feed"></div>
        <div class="turn-indicator" id="turn-indicator"></div>
      </div>

      <form id="sentence-form" class="sentence-form">
        <input id="sentence-input" maxlength="220" data-i18n-placeholder="sentence_placeholder" autocomplete="off" disabled />
        <button type="submit" class="btn btn-primary" id="sentence-submit" data-i18n="add_to_file" disabled></button>
      </form>
      <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
    </main>
  </div>
</section>

<!-- ======================= OVERLAY: CALLOUT ======================= -->
<div id="overlay-callout" class="overlay hidden">
  <div class="stamp-slam" id="stamp-slam"></div>
  <div class="callout-card">
    <div class="callout-head" data-i18n="derail_called"></div>
    <p id="callout-desc" class="callout-desc"></p>
    <div id="callout-picker" class="goal-picker"></div>
    <div id="callout-waiting" class="hint hidden"></div>
    <div id="callout-result" class="callout-result hidden"></div>
    <div class="timer-track small"><div class="timer-fill" id="callout-timer-fill"></div></div>
  </div>
</div>

<!-- ============================ SCREEN: VOTING ============================ -->
<section id="screen-voting" class="screen">
  <header class="topbar">
    <div class="topbar-code"><span data-i18n="file_label"></span> <span id="voting-code">----</span></div>
    <div class="topbar-round" data-i18n="the_verdict"></div>
  </header>
  <div class="voting-wrap">
    <h2 class="section-title" data-i18n="did_they"></h2>
    <p class="hint" data-i18n="verdict_sub"></p>
    <div id="judging-loading" class="judging-loading hidden">
      <div class="judging-stamp">?</div>
      <p data-i18n="judging_text"></p>
    </div>
    <ul id="voting-list" class="voting-list"></ul>
  </div>
</section>

<!-- ============================ SCREEN: REVEAL ============================ -->
<section id="screen-reveal" class="screen">
  <header class="topbar">
    <div class="topbar-code"><span data-i18n="file_label"></span> <span id="reveal-code">----</span></div>
    <div class="topbar-round" data-i18n="case_closed"></div>
  </header>
  <div class="reveal-wrap">
    <h2 class="section-title" data-i18n="final_scoreboard"></h2>
    <ul id="reveal-scoreboard" class="scoreboard"></ul>

    <h3 class="section-title small" data-i18n="full_story"></h3>
    <div class="paper">
      <div class="story-feed" id="reveal-story"></div>
    </div>

    <div id="reveal-host-controls" class="host-controls hidden">
      <button id="btn-play-again" class="btn btn-primary btn-lg" data-i18n="play_again_btn"></button>
    </div>

    <div class="ad-slot">
      <span class="ad-slot-label">Advertisement</span>
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-7313911947751437"
           data-ad-slot="0000000000"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </div>
  </div>
</section>

<footer class="credit-footer">
  <span id="credit-line" data-i18n="credit_line"></span>
  <span class="footer-sep">·</span>
  <a href="/privacy.html" target="_blank" rel="noopener" class="footer-link">privacy</a>
</footer>

<script src="i18n.js"></script>
<script src="sound.js"></script>
