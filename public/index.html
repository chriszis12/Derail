<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Derail Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <h1 data-i18n="title">Derail Game</h1>
      <button id="settings-btn" class="icon-btn">⚙️ <span data-i18n="settingsTitle">Settings</span></button>
    </header>

    <!-- Account Auth Section -->
    <section id="auth-section" class="card">
      <h2 data-i18n="loginHeader">Account Access</h2>
      <div id="user-display" class="hidden">
        <p>Welcome, <strong id="username-text"></strong>!</p>
        <button id="logout-btn" data-i18n="logoutBtn">Logout</button>
      </div>

      <form id="auth-form">
        <input type="text" id="username-input" data-i18n="usernamePlaceholder" placeholder="Username" required>
        <input type="password" id="password-input" data-i18n="passwordPlaceholder" placeholder="Password" required>
        <div class="auth-buttons">
          <button type="submit" id="login-btn" data-i18n="loginBtn">Login</button>
          <button type="button" id="register-btn" data-i18n="registerBtn">Register</button>
        </div>
      </form>
      <p id="auth-message" class="message"></p>
    </section>

    <!-- Game View Placeholder -->
    <main class="card">
      <div id="game-container">
        <p>🎮 <em>Game Canvas / Area Here</em></p>
      </div>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content card">
        <h2 data-i18n="settingsTitle">Settings</h2>

        <div class="setting-row">
          <label data-i18n="languageLabel">Language:</label>
          <select id="language-select">
            <option value="en">English</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
          </select>
        </div>

        <div class="setting-row">
          <label data-i18n="musicLabel">Background Music:</label>
          <button id="mute-btn">🔊 Mute / Unmute</button>
        </div>

        <div class="setting-row">
          <label data-i18n="volumeLabel">Music Volume:</label>
          <input type="range" id="volume-slider" min="0" max="0.5" step="0.01" value="0.15">
        </div>

        <div class="setting-row">
          <label data-i18n="themeLabel">Theme:</label>
          <button id="theme-btn">🌙 Dark Mode</button>
        </div>

        <hr>

        <div class="setting-row">
          <button id="credits-btn" class="secondary-btn" data-i18n="creditsBtn">View Credits</button>
        </div>

        <button id="close-settings" class="close-btn" data-i18n="closeBtn">Close</button>
      </div>
    </div>

    <!-- Credits Modal -->
    <div id="credits-modal" class="modal hidden">
      <div class="modal-content card">
        <h2 data-i18n="creditsTitle">Credits</h2>
        <p data-i18n="gameDev">Game Concept & Code: You</p>
        <p data-i18n="aiDev">AI Assistant: Gemini</p>
        <p data-i18n="musicCredit">Music Generator: Web Audio Synth Loop</p>
        <button id="close-credits" class="close-btn" data-i18n="closeBtn">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="client.js"></script>
</body>
</html>
