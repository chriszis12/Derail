<!-- Content Security Policy: blocks scripts/styles/frames from loading off
     any domain not explicitly listed here. The AdSense-related domains and
     'unsafe-inline' for styles are necessary given how this app is built
     (the UI sets a lot of inline style="" for things like the timer bar and
     colored avatar dots). A nonce-based rewrite would let style-src drop
     'unsafe-inline' for stronger protection, but that's a bigger structural
     change than a meta tag — see README for the tradeoff. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
  font-src 'self' https://fonts.gstatic.com;
  img-src 'self' data:;
  connect-src 'self' ws: wss:;
  object-src 'none';
  base-uri 'self';
" />

<!-- ======================= OVERLAY: ACCOUNT ======================= -->

<!-- ======================= OVERLAY: SETTINGS ======================= -->

        <button class="lang-option" data-lang="en"><span class="flag">🇬🇧</span> English</button>

    <div class="settings-block">

    <div class="settings-block">
      <div class="settings-label" data-i18n="settings_text_size"></div>

    <div class="settings-block">

      </div>
    </div>

    <div class="settings-block">
      <div class="settings-row">
        <span data-i18n="settings_compact"></span>
        <button id="toggle-compact" class="toggle-switch" aria-pressed="false"><span class="knob"></span></button>
      </div>
    </div>

    <div class="settings-block">
      <div class="settings-row">
        <span data-i18n="settings_haptics"></span>
        <button id="toggle-haptics" class="toggle-switch" aria-pressed="false"><span class="knob"></span></button>
      </div>
      <p class="hint settings-subtext" data-i18n="settings_haptics_hint"></p>

    <div class="settings-block">

<!-- ============================ SCREEN: HOME ============================ -->
<section id="screen-home" class="screen active">
  <div class="home-wrap">
    <div class="case-tab">CASE FILE №<span id="rand-case">0417</span></div>
    <h1 class="logo">DERAIL</h1>
    <span class="beta-badge">BETA</span>
    <p class="tagline" data-i18n="tagline"></p>

    <div class="home-card">

          <input id="name-input" maxlength="18" data-i18n-placeholder="name_placeholder" autocomplete="off" />

            <span id="avatar-preview"></span>
          </button>
        </div>
      </div>

      <div class="home-actions">
        <button id="btn-create" class="btn btn-primary" data-i18n="create_btn"></button>

        <div class="join-row">

      </div>
      <p id="join-banner" class="join-banner hidden"></p>
      <p id="home-error" class="error-line"></p>

    <details class="rules">

      <ol id="rules-list"></ol>
    </details>
  </div>
</section>

<!-- ======================= OVERLAY: AVATAR BUILDER ======================= -->
<div id="overlay-avatar" class="overlay hidden">
  <div class="callout-card avatar-card">
    <div class="callout-head" data-i18n="avatar_title"></div>
    <div class="avatar-builder">
      <div id="avatar-big-preview" class="avatar-big-preview"></div>

      <div class="avatar-picker-block">
        <div class="settings-label" data-i18n="avatar_color"></div>

  </div>
</div>

<!-- ============================ SCREEN: LOBBY ============================ -->
<section id="screen-lobby" class="screen">
  <header class="topbar">
    <div class="topbar-code">
      <span data-i18n="file_label"></span>
      <span id="lobby-code">----</span>
      <button id="btn-toggle-code" class="btn-icon-inline" title="show/hide room code" aria-label="show/hide room code">👁</button>
    </div>
    <button id="btn-copy-link" class="btn-ghost" data-i18n="copy_invite"></button>
  </header>

  <div class="lobby-wrap">
    <h2 class="section-title" data-i18n="the_roster"></h2>
    <ul id="lobby-players" class="roster"></ul>

    <div id="match-settings-block" class="match-settings hidden">
      <h3 class="rail-title" data-i18n="match_settings_title"></h3>

      <div class="match-setting-row">
        <span data-i18n="settings_language"></span>
        <div id="match-lang-menu" class="lang-menu inline">
          <button class="lang-option" data-lang="en">🇬🇧 EN</button>
          <button class="lang-option" data-lang="el">🇬🇷 EL</button>
          <button class="lang-option" data-lang="es">🇪🇸 ES</button>
        </div>
      </div>

      <div class="match-setting-row match-scenario-row">
        <span data-i18n="match_custom_scenario"></span>
        <input id="match-custom-scenario" maxlength="200" data-i18n-placeholder="match_custom_scenario_placeholder" class="mini-input" />
      </div>

      <div class="match-setting-row">
        <span data-i18n="match_turn_time"></span>
        <select id="match-turn-seconds" class="mini-select">
          <option value="10">10s</option>
          <option value="15">15s</option>
          <option value="20">20s</option>
          <option value="30">30s</option>
        </select>
      </div>

      <div class="match-setting-row">
        <span data-i18n="match_rounds"></span>
        <select id="match-max-rounds" class="mini-select">
          <option value="6">6</option>
          <option value="8">8</option>
          <option value="10">10</option>
          <option value="14">14</option>
          <option value="20">20</option>
        </select>
      </div>

      <div class="match-setting-row">
        <span data-i18n="match_trojan"></span>
        <select id="match-trojan-mode" class="mini-select">
          <option value="auto" data-i18n="match_trojan_auto"></option>
          <option value="always" data-i18n="match_trojan_always"></option>
          <option value="never" data-i18n="match_trojan_never"></option>
        </select>
      </div>

      <div class="match-setting-row">
        <span data-i18n="match_chaos"></span>
        <select id="match-chaos" class="mini-select">
          <option value="off" data-i18n="match_chaos_off"></option>
          <option value="normal" data-i18n="match_chaos_normal"></option>
          <option value="chaos" data-i18n="match_chaos_chaos"></option>
        </select>
      </div>

      <div class="match-setting-row">
        <span data-i18n="match_public"></span>
        <button id="toggle-public" class="toggle-switch" role="switch"><span class="knob"></span></button>
      </div>

      <div class="match-setting-row">
        <span data-i18n="match_ai_judge"></span>
        <button id="toggle-ai-judge" class="toggle-switch" role="switch"><span class="knob"></span></button>
      </div>
      <p id="ai-judge-hint" class="hint ai-judge-hint hidden" data-i18n="match_ai_judge_unavailable"></p>
    </div>
    <p id="match-settings-readonly" class="hint hidden"></p>

    <div id="host-controls" class="host-controls">
      <button id="btn-start" class="btn btn-primary btn-lg" data-i18n="start_game_btn"></button>
      <p class="hint" data-i18n="need_two"></p>
    </div>
    <p id="waiting-note" class="hint hidden" data-i18n="waiting_host"></p>
  </div>
</section>

<!-- ============================ SCREEN: GAME ============================ -->
<section id="screen-game" class="screen">
  <header class="topbar">
    <div class="topbar-code"><span data-i18n="file_label"></span> <span id="game-code">----</span></div>
    <div class="topbar-round"><span data-i18n="round_label"></span> <span id="round-num">0</span> / <span id="round-max">10</span></div>
    <button id="btn-leave" class="btn-ghost" data-i18n="leave_btn"></button>
  </header>

  <div class="game-wrap">

    <!-- Left: players / suspects rail -->
    <aside class="rail">
      <h3 class="rail-title" data-i18n="suspects"></h3>
      <ul id="player-rail" class="rail-list"></ul>

      <div class="goal-card" id="goal-card">
        <div class="goal-pin"></div>
        <div class="goal-label" data-i18n="your_objective"></div>
        <div class="goal-text" id="goal-text"></div>
      </div>
    </aside>

    <!-- Center: the story -->
    <main class="storyboard">
      <div class="scenario-strip" id="scenario-strip"></div>

      <div class="banned-strip" id="banned-strip"></div>

      <div class="paper">
        <div class="paper-torn"></div>
        <div class="story-feed" id="story-feed"></div>
        <div class="turn-indicator" id="turn-indicator"></div>
      </div>

      <form id="sentence-form" class="sentence-form">
        <input id="sentence-input" maxlength="220" data-i18n-placeholder="sentence_placeholder" autocomplete="off" disabled />
        <button type="submit" class="btn btn-primary" id="sentence-submit" data-i18n="add_to_file" disabled></button>
      </form>
      <div class="timer-track"><div class="timer-fill" id="timer-fill"></div></div>
    </main>
  </div>
</section>

<!-- ======================= OVERLAY: CALLOUT ======================= -->
<div id="overlay-callout" class="overlay hidden">
  <div class="stamp-slam" id="stamp-slam"></div>
  <div class="callout-card">
    <div class="callout-head" data-i18n="derail_called"></div>
    <p id="callout-desc" class="callout-desc"></p>
    <div id="callout-picker" class="goal-picker"></div>
    <div id="callout-waiting" class="hint hidden"></div>
    <div id="callout-result" class="callout-result hidden"></div>
    <div class="timer-track small"><div class="timer-fill" id="callout-timer-fill"></div></div>
  </div>
</div>

<!-- ============================ SCREEN: VOTING ============================ -->
<section id="screen-voting" class="screen">
  <header class="topbar">
    <div class="topbar-code"><span data-i18n="file_label"></span> <span id="voting-code">----</span></div>

      <div class="judging-stamp">?</div>
      <p data-i18n="judging_text"></p>
    </div>
    <ul id="voting-list" class="voting-list"></ul>
  </div>
</section>

  <header class="topbar">
    <div class="topbar-code"><span data-i18n="file_label"></span> <span id="reveal-code">----</span></div>

    <div id="reveal-host-controls" class="host-controls hidden">

</section>
